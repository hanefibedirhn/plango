      <path d="M0 95 L78 30 L156 95 V205 H0 Z" fill="#FFFFFF"/>
      <path d="M-10 102 L78 20 L166 102" fill="none" stroke="#0B2239" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="62" y="72" width="28" height="28" rx="3" fill="#16C7B0"/>
      <rect x="96" y="72" width="28" height="28" rx="3" fill="#16C7B0"/>
      <rect x="62" y="106" width="28" height="28" rx="3" fill="#16C7B0"/>
      <rect x="96" y="106" width="28" height="28" rx="3" fill="#16C7B0"/>
      <rect x="20" y="145" width="38" height="60" rx="3" fill="#DDE8EA"/>
    </g>

    <!-- car -->
    <g transform="translate(468,462)">
      <path d="M10 58 C18 25 35 8 68 8 H116
               C149 8 167 25 175 58 L186 66
               V118 H0 V66 Z" fill="#16C7B0"/>
      <path d="M35 56 L48 25 H136 L150 56 Z" fill="#DDF8F4"/>
      <rect x="28" y="68" width="35" height="12" rx="6" fill="#F7F9FB"/>
      <rect x="123" y="68" width="35" height="12" rx="6" fill="#F7F9FB"/>
      <circle cx="35" cy="116" r="13" fill="#0B2239"/>
      <circle cx="151" cy="116" r="13" fill="#0B2239"/>
    </g>
