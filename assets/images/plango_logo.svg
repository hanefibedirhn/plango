    <path d="M110 40 H385
             C535 40 610 125 610 245
             C610 355 545 430 438 452
             L438 335
             C492 320 517 286 517 242
             C517 186 475 151 398 151
             H245
             V625
             H110 Z"
          fill="url(#brand)"/>

    <!-- road sweep -->
    <path d="M55 655
             C115 490 180 360 278 275
             C355 208 434 166 493 151
             C420 208 365 262 327 323
             C270 413 247 513 243 655 Z"
          fill="#F7F9FB"/>

    <path d="M78 655
             C128 516 184 406 265 330
             C328 270 392 226 447 199
             C378 257 327 316 294 380
             C253 460 236 548 233 655 Z"
          fill="url(#roadGrad)"/>

    <!-- lane marks -->
    <g fill="#F7F9FB">
      <path d="M158 575 l14 -36 l9 3 l-13 37 z"/>
      <path d="M177 521 l17 -38 l9 4 l-16 39 z"/>
      <path d="M200 463 l19 -39 l9 5 l-18 39 z"/>
      <path d="M228 404 l22 -37 l9 6 l-22 37 z"/>
      <path d="M260 347 l26 -34 l8 7 l-26 34 z"/>
