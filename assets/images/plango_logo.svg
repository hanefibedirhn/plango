  <!-- wordmark -->
  <g transform="translate(730,230)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="6" fill="#0B2239">PLANGO</text>
    <polygon points="270,-18 292,22 248,22" fill="#16C7B0"/>
    <text x="5" y="88" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="5" fill="#0B2239">
